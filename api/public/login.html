<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | FastWebsiteCreator Admin</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/admin/assets/login.js" defer></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M18 4 8 18h7l-2 10 11-15h-7z" fill="#0b1020"/></svg>
      <span>FastWebsite<b>Creator</b></span>
    </div>
    <h1>Owner dashboard</h1>
    <form id="login-form" novalidate>
      <label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-block" type="submit">Sign in</button>
      <p class="form-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
