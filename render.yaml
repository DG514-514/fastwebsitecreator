# Render Blueprint — free static website + free brief/upload service. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fastwebsitecreator
    runtime: static
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    domains:
      - fastwebsitecreator.com
      - www.fastwebsitecreator.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Receives the website's project brief form (with file uploads) and emails it to you.
  - type: web
    name: fastwebsitecreator-api
    runtime: node
    plan: free
    rootDir: api
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://fastwebsitecreator.com,https://www.fastwebsitecreator.com,https://fastwebsitecreator.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
